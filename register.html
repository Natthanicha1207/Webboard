<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Register - Webboard</title>
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <a href="index.html" class="brand">Webboard</a>
        </header>

        <main>
            <h2>Register through</h2>

            <div class="login-box">
                <h3>Register</h3>

                <button class="social-btn facebook" onclick="location.href='register-step2.html?method=facebook'">Register with Facebook</button>
                <script async defer crossorigin="anonymous"
                    src="https://connect.facebook.net/en_US/sdk.js"></script>
                <script>
                window.fbAsyncInit=function() {
                    FB.init({
                        appId: '1669271767766961',
                        cookie: true,
                        xfbml: true,
                        version: 'v19.0'
                    });
                }
                </script>
                <button class="social-btn google" onclick="location.href='register-step2.html?method=google'">Register with Google</button>
                <button class="social-btn X" onclick="location.href='register-step2.html?method=x'">Register with X</button>

                <div class="divider">or</div>

                <button class="social-btn email-btn" onclick="location.href='register-step2.html?method=email'">Register with Email</button>

                <p>Already have an account? <a href="login.html">Log in</a></p>
            </div>
        </main>
    </body>
</html>
