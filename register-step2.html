<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Register — Details - Webboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <a href="index.html" class="brand">Webboard</a>
    </header>

    <main>
      <h2>Complete your registration</h2>

      <div class="login-box">
        <h3>Account details</h3>

        <p id="methodMsg" style="font-weight:600;color:#3a2a1a"></p>

        <div id="error" style="color:#c00"></div>

        <form id="regForm" action="register-success.html" method="get">
          <label for="profilePic">Profile picture (optional)</label>
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
            <div style="width:84px;height:84px;border-radius:50%;overflow:hidden;background:#f3f0ee;display:flex;align-items:center;justify-content:center;border:1px solid #eee;">
              <img id="profilePreview" src="" alt="preview" style="width:100%;height:100%;object-fit:cover;display:none;" />
              <span id="profilePlaceholder" style="color:#bbb;font-size:12px;">No photo</span>
            </div>
            <div style="display:flex;flex-direction:column;gap:8px;">
              <input id="profilePicInput" type="file" accept="image/*" style="display:inline-block">
              <div style="display:flex;gap:8px;">
                <button type="button" id="removeProfileBtn" style="display:none;padding:8px;border-radius:8px;border:1px solid #ddd;background:#fff;">Remove</button>
                <span style="font-size:12px;color:#666">Recommended: square image, under 2MB</span>
              </div>
            </div>
          </div>
          <input type="hidden" id="method" name="method" value="">
          <label for="fullname">Name - Surname</label>
          <input id="fullname" name="fullname" class="login-input" type="text" placeholder="First Last" required>

          <div style="display:flex;gap:8px;">
          <select id="birthDay" name="birthDay" class="login-input" required>
            <option value="">Day</option>
          </select>
          <select id="birthMonth" name="birthMonth" class="login-input" required>
            <option value="">Month</option>
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
          <select id="birthYear" name="birthYear" class="login-input" required>
            <option value="">Year</option>
          </select>
          </div>

          <label for="gender">Gender</label>
          <select id="gender" name="gender" class="login-input">
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>

          <label for="accountName">Account Name (cannot change later)</label>
          <input id="accountName" name="accountName" class="login-input" type="text" placeholder="Account name (permanent)" required>

          <label for="username">Username (can change later)</label>
          <input id="username" name="username" class="login-input" type="text" placeholder="Display username" required>

          <label for="password">Password</label>
          <input id="password" name="password" class="login-input" type="password" placeholder="Create a password" required>

          <label for="password2">Confirm password</label>
          <input id="password2" name="password2" class="login-input" type="password" placeholder="Repeat your password" required>

          <div style="display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:10px;">
            <a href="register.html" style="text-decoration:none;color:#6B3A2A">Back</a>
            <button class="register-btn" type="submit">Submit</button>
          </div>
        </form>
      </div>
    </main>

    <script>
      // profile picture handling
      (function(){
        const input = document.getElementById('profilePicInput');
        const preview = document.getElementById('profilePreview');
        const placeholder = document.getElementById('profilePlaceholder');
        const removeBtn = document.getElementById('removeProfileBtn');
        const storageKey = 'reg_profile_pic';

        function loadSaved(){
          try{
            const raw = localStorage.getItem(storageKey);
            if(!raw) return;
            preview.src = raw;
            preview.style.display = 'block';
            placeholder.style.display = 'none';
            removeBtn.style.display = 'inline-block';
          }catch(e){}
        }

        function setPreviewDataURL(dataURL){
          preview.src = dataURL;
          preview.style.display = 'block';
          placeholder.style.display = 'none';
          removeBtn.style.display = 'inline-block';
          try{ localStorage.setItem(storageKey, dataURL); }catch(e){}
        }

        input.addEventListener('change', function(e){
          const f = e.target.files && e.target.files[0];
          if(!f) return;
          if(!f.type.startsWith('image/')){ alert('Please choose an image file'); input.value = ''; return; }
          if(f.size > 2*1024*1024){ alert('Image too large (max 2MB)'); input.value = ''; return; }
          const reader = new FileReader();
          reader.onload = function(){ setPreviewDataURL(reader.result); };
          reader.readAsDataURL(f);
        });

        removeBtn.addEventListener('click', function(){
          input.value = '';
          preview.src = '';
          preview.style.display = 'none';
          placeholder.style.display = 'block';
          removeBtn.style.display = 'none';
          try{ localStorage.removeItem(storageKey); }catch(e){}
        });

        // load saved preview if user navigated back
        loadSaved();
      })();

      function showError(msg){
        document.getElementById('error').textContent = msg;
      }

      // set method from querystring and show method message
      (function(){
        const params = new URLSearchParams(location.search);
        const method = params.get('method');
        if(method){
          document.getElementById('method').value = method;
          const pretty = method === 'facebook' ? 'Facebook' : method === 'google' ? 'Google' : method === 'x' ? 'X' : 'Email';
          document.getElementById('methodMsg').textContent = 'Registering via ' + pretty + (method === 'email' ? '' : ' (you will be redirected to ' + pretty + ' to authenticate)');
        }
      })();

      document.getElementById('regForm').addEventListener('submit', function(e){
        showError('');
        const p = document.getElementById('password').value;
        const p2 = document.getElementById('password2').value;
        if(p !== p2){ e.preventDefault(); showError('Passwords do not match.'); return; }

        const bd = document.getElementById('birthday').value;
        if(!bd){ e.preventDefault(); showError('Birthday is required.'); return; }
        const d = new Date(bd);
        if(Number.isNaN(d.getTime())){ e.preventDefault(); showError('Invalid birthday date.'); return; }

        const acct = document.getElementById('accountName').value.trim();
        if(!acct){ e.preventDefault(); showError('Account Name is required and cannot be empty.'); return; }

        // persist chosen profile picture (already stored in localStorage by change handler)
        // All validations passed — allow the form to submit to register-success.html
        localStorage.setItem('customUsername', document.getElementById('username').value.trim());
      });
      // Populate day dropdown
const daySelect = document.getElementById('birthDay');
for(let d = 1; d <= 31; d++){
    const opt = document.createElement('option');
    opt.value = d;
    opt.textContent = d;
    daySelect.appendChild(opt);
}

// Populate year dropdown
const yearSelect = document.getElementById('birthYear');
for(let y = 2010; y >= 1990; y--){
    const opt = document.createElement('option');
    opt.value = y;
    opt.textContent = y;
    yearSelect.appendChild(opt);
}
    </script>
  </body>
</html>
